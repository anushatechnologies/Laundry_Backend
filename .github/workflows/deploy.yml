name: Deploy Laundry Backend to AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure SSH Key
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY || secrets.EC2_PRIVATE_KEY || secrets.SSH_KEY }}
          HOST: ${{ secrets.EC2_HOST || secrets.HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts

      - name: Execute Remote Deployment via SSH
        env:
          HOST: ${{ secrets.EC2_HOST || secrets.HOST }}
          USER: ${{ secrets.EC2_USER || secrets.USERNAME || 'ec2-user' }}
          PORT: ${{ secrets.PORT || '5000' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT || '3306' }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME || 'laundry' }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'ap-south-1' }}
          AWS_S3_BUCKET_NAME: ${{ secrets.AWS_S3_BUCKET_NAME || 'laundry-storage-2026' }}
          GOOGLE_MAPS_SERVER_KEY: ${{ secrets.GOOGLE_MAPS_SERVER_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY_ID: ${{ secrets.FIREBASE_PRIVATE_KEY_ID }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE || 'false' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM || 'LaundryFresh <hello@laundryfresh.com>' }}
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa "$USER@$HOST" << 'EOF'
            export PATH=$PATH:/usr/local/bin:/usr/bin:~/.nvm/versions/node/$(node -v 2>/dev/null)/bin

            echo "Connected to $(hostname) as $(whoami)"
            APP_DIR="/var/www/laundry-backend"

            # 1. Ensure directory exists with correct permissions
            if [ ! -d "$APP_DIR" ]; then
              sudo mkdir -p "$APP_DIR"
              sudo chown -R $(whoami):$(whoami) "$APP_DIR"
              git clone https://github.com/anushatechnologies/Laundry_Backend.git "$APP_DIR"
            fi

            cd "$APP_DIR"

            # 2. Fetch and pull latest code
            git fetch origin main
            git reset --hard origin/main

            # 3. Write production .env file
            cat << 'ENV_EOF' > .env
          PORT=${{ secrets.PORT || '5000' }}
          NODE_ENV=production
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }}

          # AWS RDS MySQL Database
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=${{ secrets.DB_PORT || '3306' }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_NAME=${{ secrets.DB_NAME || 'laundry' }}

          # AWS S3 Cloud Storage
          AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION=${{ secrets.AWS_REGION || 'ap-south-1' }}
          AWS_S3_BUCKET_NAME=${{ secrets.AWS_S3_BUCKET_NAME || 'laundry-storage-2026' }}

          # Google Maps Geocoding
          GOOGLE_MAPS_SERVER_KEY=${{ secrets.GOOGLE_MAPS_SERVER_KEY }}

          # Firebase Admin SDK Credentials
          FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL=${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY_ID=${{ secrets.FIREBASE_PRIVATE_KEY_ID }}
          FIREBASE_PRIVATE_KEY="${{ secrets.FIREBASE_PRIVATE_KEY }}"
          FIREBASE_DATABASE_URL=${{ secrets.FIREBASE_DATABASE_URL }}

          # SMTP Transactional Emails
          SMTP_HOST=${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT=${{ secrets.SMTP_PORT || '587' }}
          SMTP_SECURE=${{ secrets.SMTP_SECURE || 'false' }}
          SMTP_USER=${{ secrets.SMTP_USER }}
          SMTP_PASS=${{ secrets.SMTP_PASS }}
          EMAIL_FROM="${{ secrets.EMAIL_FROM || 'LaundryFresh <hello@laundryfresh.com>' }}"

          # Razorpay Payment Gateway
          RAZORPAY_KEY_ID=${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET=${{ secrets.RAZORPAY_KEY_SECRET }}
          ENV_EOF

            # 4. Write serviceAccountKey.json if secret provided
            if [ -n "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" ]; then
              cat << 'F_EOF' > serviceAccountKey.json
          ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          F_EOF
            fi

            # 5. Install dependencies and compile TypeScript
            echo "Installing dependencies..."
            npm install --production=false

            echo "Building application..."
            npm run build

            # 6. Restart PM2 Process
            if pm2 describe laundry-api > /dev/null 2>&1; then
              echo "Restarting existing PM2 laundry-api..."
              pm2 restart laundry-api --update-env
            else
              echo "Starting new PM2 laundry-api..."
              pm2 start dist/server.js --name laundry-api
              pm2 save
            fi

            echo "🎉 Deployment successfully completed!"
          EOF
